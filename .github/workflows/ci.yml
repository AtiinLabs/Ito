name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Ito.xcodeproj
  SCHEME: Ito

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Ito
        uses: actions/checkout@v7
        with:
          path: Ito
          persist-credentials: false

      # Ito.xcodeproj currently references ../ito-runner as a local Swift package.
      # Keep the repositories side by side until the Xcode project is changed to a
      # pinned remote package dependency.
      - name: Read pinned ito-runner revision
        id: runner
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/ito-runner.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout ito-runner
        uses: actions/checkout@v7
        with:
          repository: itoapp/ito-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: ito-runner
          persist-credentials: false

      
      - name: Read pinned WasmKit revision
        id: wasmkit_ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/wasmkit.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout WasmKit
        uses: actions/checkout@v7
        with:
          repository: kunihir0/WasmKit
          ref: ${{ steps.wasmkit_ref.outputs.ref }}
          path: WasmKit
          persist-credentials: false

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        working-directory: Ito
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -skipPackagePluginValidation \
            | tee resolve-packages.log

      - name: Select an available iPhone simulator
        id: simulator
        working-directory: Ito
        shell: bash
        run: echo "id=$(python3 scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"

      # Build once for the simulator that runs the tests. A generic simulator
      # destination also compiles x86_64, which no test ever executes.
      - name: Build for testing
        working-directory: Ito
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build.log

      - name: Run unit tests
        working-directory: Ito
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:ItoTests \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            | tee test.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            Ito/*.log
            Ito/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
