name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Ito.xcodeproj
  SCHEME: Ito

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Ito
        uses: actions/checkout@v7
        with:
          path: Ito
          persist-credentials: false

      # Ito.xcodeproj currently references ../ito-runner as a local Swift package.
      # Keep the repositories side by side until the Xcode project is changed to a
      # pinned remote package dependency.
      - name: Read pinned ito-runner revision
        id: runner
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/ito-runner.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout ito-runner
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/ito-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: ito-runner
          persist-credentials: false

      
      - name: Read pinned WasmKit revision
        id: wasmkit_ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/wasmkit.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout WasmKit
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/WasmKit
          ref: ${{ steps.wasmkit_ref.outputs.ref }}
          path: WasmKit
          persist-credentials: false

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      # Keep package checkouts outside DerivedData so they can be cached. The key
      # covers every input to the package graph, including the pinned local packages.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Ito/Ito.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Ito/.github/ito-runner.ref', 'Ito/.github/wasmkit.ref') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        working-directory: Ito
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -skipPackagePluginValidation \
            | tee resolve-packages.log

      - name: Select an available iPhone simulator
        id: simulator
        working-directory: Ito
        shell: bash
        run: echo "id=$(python3 scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"

      # Build once for the simulator that runs the tests. A generic simulator
      # destination also compiles x86_64, which no test ever executes.
      - name: Build for testing
        working-directory: Ito
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build.log

      # Parallel testing clones the simulator. Every test ran on Clone 1, while
      # Clone 2 boot/launch failures exited 65 after all tests passed (#53, #76, #79).
      - name: Run unit tests
        working-directory: Ito
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:ItoTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -skipPackagePluginValidation \
            | tee test.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            Ito/*.log
            Ito/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
