name: Publish stable unsigned IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write

# gh-pages writes are serialized by publish_altstore_source.sh, not by this group.
concurrency:
  group: ito-release
  cancel-in-progress: false

env:
  PROJECT: Ito.xcodeproj
  SCHEME: Ito
  BUNDLE_ID: moe.itoapp.ito

jobs:
  release:
    name: Test, package, and publish
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a stable tag such as v1.2.3; got: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Checkout Ito at the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: Ito
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag location
        working-directory: Ito
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Stable tags must point to a commit contained in main." >&2
            exit 1
          }

      - name: Verify app version and compute build number
        id: version
        working-directory: Ito
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Configuration/Version.xcconfig is the source of truth; the tag must match it.
          FILE_VERSION="$(awk -F ' *= *' '$1 == "MARKETING_VERSION" { print $2 }' Configuration/Version.xcconfig)"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "$TAG is version $VERSION, but Configuration/Version.xcconfig at the tag says ${FILE_VERSION:-nothing}." >&2
            echo "Bump MARKETING_VERSION on main before tagging." >&2
            exit 1
          fi
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read pinned ito-runner revision
        id: runner
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/ito-runner.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout ito-runner
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/ito-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: ito-runner
          persist-credentials: false

      
      - name: Read pinned WasmKit revision
        id: wasmkit_ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/wasmkit.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout WasmKit
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/WasmKit
          ref: ${{ steps.wasmkit_ref.outputs.ref }}
          path: WasmKit
          persist-credentials: false

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        working-directory: Ito
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -skipPackagePluginValidation \
            | tee resolve-packages.log

      - name: Select an available iPhone simulator
        id: simulator
        working-directory: Ito
        shell: bash
        run: echo "id=$(python3 scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests before release
        working-directory: Ito
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -only-testing:ItoTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee test.log

      - name: Build unsigned IPA
        id: ipa
        working-directory: Ito
        env:
          MARKETING_VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          CHANNEL: stable
        run: scripts/build_unsigned_ipa.sh build/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ito-${{ steps.release.outputs.version }}-unsigned
          path: |
            Ito/${{ steps.ipa.outputs.ipa_path }}
            Ito/${{ steps.ipa.outputs.checksum_path }}
            Ito/${{ steps.ipa.outputs.tipa_path }}
            Ito/${{ steps.ipa.outputs.tipa_checksum_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Create or update GitHub Release
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.ipa.outputs.checksum_path }}
          TIPA_PATH: ${{ steps.ipa.outputs.tipa_path }}
          TIPA_CHECKSUM_PATH: ${{ steps.ipa.outputs.tipa_checksum_path }}
        run: |
          set -euo pipefail
          assets=("$IPA_PATH" "$CHECKSUM_PATH" "$TIPA_PATH" "$TIPA_CHECKSUM_PATH")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Ito $VERSION"
          fi

      - name: Publish stable AltStore and SideStore source
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: stable
          VERSION: ${{ steps.release.outputs.version }}
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          RELEASE_NOTES: Unsigned Ito ${{ steps.release.outputs.version }} build. AltStore and SideStore re-sign it with the user's Apple account.
        run: scripts/publish_altstore_source.sh
