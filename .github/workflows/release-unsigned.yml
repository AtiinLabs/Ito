name: Publish beta or stable unsigned IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, such as v1.2.3-beta.1, v1.2.3-rc.1, or v1.2.3
        required: true
        type: string

permissions:
  contents: write

# Stable, beta, and nightly workflows all update the same gh-pages branch.
concurrency:
  group: ito-pages-publication
  cancel-in-progress: false

env:
  PROJECT: Ito.xcodeproj
  SCHEME: Ito
  BUNDLE_ID: moe.itoapp.ito

jobs:
  release:
    name: Test, package, and publish
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            DISPLAY_VERSION="$BASE_VERSION"
            CHANNEL="stable"
            PRERELEASE="false"
            RETENTION_DAYS="90"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(beta|rc)\.([0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            DISPLAY_VERSION="${TAG#v}"
            CHANNEL="beta"
            PRERELEASE="true"
            RETENTION_DAYS="30"
          else
            echo "Expected v1.2.3, v1.2.3-beta.1, or v1.2.3-rc.1; got: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "retention_days=$RETENTION_DAYS" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout Ito at the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: Ito
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag location
        working-directory: Ito
        shell: bash
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

          if [[ "$CHANNEL" == "stable" ]]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo "Stable tags must point to a commit contained in main." >&2
              exit 1
            }
            exit 0
          fi

          # Prerelease tags may be cut from main, release/X.Y.Z, or hotfix/X.Y.Z.
          while IFS= read -r ref; do
            if git merge-base --is-ancestor HEAD "$ref"; then
              echo "Prerelease tag is contained in $ref"
              exit 0
            fi
          done < <(
            {
              echo origin/main
              git for-each-ref --format='%(refname:short)' refs/remotes/origin/release refs/remotes/origin/hotfix
            } | sort -u
          )

          echo "Prerelease tags must be contained in main, release/*, or hotfix/*." >&2
          exit 1

      - name: Read pinned ito-runner revision
        id: runner
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/ito-runner.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout ito-runner
        uses: actions/checkout@v7
        with:
          repository: itoapp/ito-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: ito-runner
          persist-credentials: false

      
      - name: Read pinned WasmKit revision
        id: wasmkit_ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/wasmkit.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout WasmKit
        uses: actions/checkout@v7
        with:
          repository: kunihir0/WasmKit
          ref: ${{ steps.wasmkit_ref.outputs.ref }}
          path: WasmKit
          persist-credentials: false

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        working-directory: Ito
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -skipPackagePluginValidation \
            | tee resolve-packages.log

      - name: Select an available iPhone simulator
        id: simulator
        working-directory: Ito
        shell: bash
        run: echo "id=$(python3 scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests before release
        working-directory: Ito
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -only-testing:ItoTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee test.log

      - name: Build unsigned IPA
        id: ipa
        working-directory: Ito
        env:
          MARKETING_VERSION: ${{ steps.release.outputs.base_version }}
          ARTIFACT_VERSION: ${{ steps.release.outputs.display_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: scripts/build_unsigned_ipa.sh build/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ito-${{ steps.release.outputs.display_version }}-unsigned
          path: |
            Ito/${{ steps.ipa.outputs.ipa_path }}
            Ito/${{ steps.ipa.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.release.outputs.retention_days) }}
          compression-level: 0

      - name: Create or update GitHub Release
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.release.outputs.display_version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.ipa.outputs.checksum_path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" "$CHECKSUM_PATH" --clobber
          else
            args=(
              "$TAG"
              "$IPA_PATH"
              "$CHECKSUM_PATH"
              --verify-tag
              --generate-notes
              --title "Ito $DISPLAY_VERSION"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

      - name: Publish AltStore and SideStore channel source
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.display_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          RELEASE_NOTES: Unsigned Ito ${{ steps.release.outputs.display_version }} build. AltStore and SideStore re-sign it with the user's Apple account.
        run: scripts/publish_altstore_source.sh
