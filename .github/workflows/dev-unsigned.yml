name: Publish dev unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# A newer main supersedes an in-progress dev build. gh-pages writes are
# serialized by .github/scripts/gh_pages.sh, not by this group.
concurrency:
  group: ito-dev
  cancel-in-progress: true

env:
  PROJECT: Ito.xcodeproj
  SCHEME: Ito
  BUNDLE_ID: moe.itoapp.ito
  DEV_RELEASES_TO_KEEP: '14'

jobs:
  dev:
    name: Test, package, and publish dev
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout the pushed main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: Ito
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned ito-runner revision
        id: runner
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/ito-runner.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout ito-runner
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/ito-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: ito-runner
          persist-credentials: false

      
      - name: Read pinned WasmKit revision
        id: wasmkit_ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < Ito/.github/wasmkit.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout WasmKit
        uses: actions/checkout@v7
        with:
          repository: AtiinLabs/WasmKit
          ref: ${{ steps.wasmkit_ref.outputs.ref }}
          path: WasmKit
          persist-credentials: false

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        working-directory: Ito
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -skipPackagePluginValidation \
            | tee resolve-packages.log

      - name: Resolve dev metadata
        id: dev
        working-directory: Ito
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$({
            xcodebuild -showBuildSettings \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM=
          } | awk -F ' = ' '/ MARKETING_VERSION = / {print $2; exit}')"

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MARKETING_VERSION must be numeric X.Y.Z; got: $BASE_VERSION" >&2
            exit 1
          fi

          # Build numbers are the commit count of the built commit, shared with stable tags.
          BUILD="$(git rev-list --count HEAD)"

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=${BASE_VERSION}-dev.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${BUILD}" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Select an available iPhone simulator
        id: simulator
        working-directory: Ito
        shell: bash
        run: echo "id=$(python3 .github/scripts/select_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests before dev publication
        working-directory: Ito
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -only-testing:ItoTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee test.log

      - name: Build unsigned dev IPA
        id: ipa
        working-directory: Ito
        env:
          MARKETING_VERSION: ${{ steps.dev.outputs.base_version }}
          ARTIFACT_VERSION: ${{ steps.dev.outputs.display_version }}
          BUILD_NUMBER: ${{ steps.dev.outputs.build }}
          CHANNEL: dev
        run: .github/scripts/build_unsigned_ipa.sh build/dev

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ito-${{ steps.dev.outputs.display_version }}-unsigned
          path: |
            Ito/${{ steps.ipa.outputs.ipa_path }}
            Ito/${{ steps.ipa.outputs.checksum_path }}
            Ito/${{ steps.ipa.outputs.tipa_path }}
            Ito/${{ steps.ipa.outputs.tipa_checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create dev prerelease
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.dev.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.dev.outputs.display_version }}
          SHA_SHORT: ${{ steps.dev.outputs.sha_short }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.ipa.outputs.checksum_path }}
          TIPA_PATH: ${{ steps.ipa.outputs.tipa_path }}
          TIPA_CHECKSUM_PATH: ${{ steps.ipa.outputs.tipa_checksum_path }}
        run: |
          set -euo pipefail
          assets=("$IPA_PATH" "$CHECKSUM_PATH" "$TIPA_PATH" "$TIPA_CHECKSUM_PATH")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Ito dev $DISPLAY_VERSION" \
              --notes "Automated unsigned dev build from main at commit $SHA_SHORT. This build is for testing and may be unstable."
          fi

      - name: Publish dev AltStore and SideStore source
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.dev.outputs.tag }}
          CHANNEL: dev
          VERSION: ${{ steps.dev.outputs.display_version }}
          APP_VERSION: ${{ steps.dev.outputs.base_version }}
          BUILD_NUMBER: ${{ steps.dev.outputs.build }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          MAX_VERSIONS: ${{ env.DEV_RELEASES_TO_KEEP }}
          RELEASE_NOTES: Automated unsigned dev build from main at ${{ steps.dev.outputs.sha_short }}. This build may be unstable.
        run: .github/scripts/publish_altstore_source.sh

      - name: Prune old dev releases and tags
        working-directory: Ito
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ env.DEV_RELEASES_TO_KEEP }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true and (.tag_name | startswith("dev-"))) | [.created_at, (.id | tostring), .tag_name] | @tsv' \
            | sort -r \
            | tail -n "+$((KEEP + 1))" \
            | while IFS=$'\t' read -r _created release_id tag; do
                [[ -n "$release_id" ]] || continue
                echo "Deleting old dev release $tag"
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
              done
